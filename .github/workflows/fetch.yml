name: 抓取股價資料

on:
  schedule:
    - cron: "30 7 * * 1-5"    # 台灣時間 15:30（台股收盤後）
    - cron: "30 22 * * 1-5"   # 台灣時間 06:30（美股收盤後）
  workflow_dispatch:           # 允許手動執行

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取資料
        env:
          SYMBOLS: "2330,0050,00631L"
          RANGE: "5y"
        run: |
          python3 - <<'PY'
          import json, os, re, sys, time, datetime
          import urllib.request, urllib.error

          symbols = [s.strip().upper() for s in os.environ["SYMBOLS"].split(",") if s.strip()]
          rng = os.environ.get("RANGE", "5y")
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

          def get(url):
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": UA})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          return None
                      print("  HTTP", e.code, "重試中")
                  except Exception as e:
                      print("  錯誤", e, "重試中")
                  time.sleep(2 * (attempt + 1))
              return None

          def candidates(s):
              if re.fullmatch(r"\d{4,6}[A-Z]?", s):
                  return [s + ".TW", s + ".TWO"]
              return [s]

          def fetch(sym):
              for host in ("query1", "query2"):
                  url = "https://%s.finance.yahoo.com/v8/finance/chart/%s?range=%s&interval=1d" % (host, sym, rng)
                  j = get(url)
                  if not j:
                      continue
                  try:
                      r = j["chart"]["result"][0]
                      ts = r["timestamp"]
                      q = r["indicators"]["quote"][0]
                      off = r["meta"].get("gmtoffset", 0)
                      rows = []
                      for i, t in enumerate(ts):
                          c = q["close"][i]
                          h = q["high"][i]
                          if c is None or h is None:
                              continue
                          d = datetime.datetime.fromtimestamp(t + off, datetime.timezone.utc).strftime("%Y-%m-%d")
                          rows.append([d, q["open"][i], h, q["low"][i], c, q["volume"][i] or 0])
                      if rows:
                          m = r["meta"]
                          return {
                              "symbol": sym,
                              "name": m.get("longName") or m.get("shortName") or sym,
                              "currency": m.get("currency", ""),
                              "rows": rows,
                          }
                  except Exception as e:
                      print("  解析失敗", e)
              return None

          old = {}
          if os.path.exists("data.json"):
              try:
                  with open("data.json", encoding="utf-8") as f:
                      old = json.load(f).get("stocks", {})
              except Exception:
                  old = {}

          stocks = {}
          ok = 0
          for s in symbols:
              print("抓取", s)
              res = None
              for cand in candidates(s):
                  res = fetch(cand)
                  if res:
                      break
              if res:
                  stocks[s] = res
                  ok += 1
                  print("  成功，共", len(res["rows"]), "筆，最新", res["rows"][-1][0])
              else:
                  print("  失敗，保留舊資料" if s in old else "  失敗，無舊資料")
                  if s in old:
                      stocks[s] = old[s]

          out = {
              "updated": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "stocks": stocks,
          }
          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, separators=(",", ":"))

          if ok == 0:
              print("全部抓取失敗")
              sys.exit(1)
          PY

      - name: 提交資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -m "更新股價資料"
            git push
          fi
