<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>環境測試</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    padding:16px;line-height:1.8;font-size:15px}
  li{margin-bottom:10px}
  b{color:#b54708}
  b.ok{color:#12a150}
  pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:#f2f2f2;color:#222;padding:8px;border-radius:8px}
</style>
</head>
<body>
<h3>環境測試</h3>
<ul>
  <li>① 內嵌 script 是否執行：<b id="t1">未執行（script 被擋或被過濾）</b></li>
  <li>② onclick 是否有效：
    <button onclick="document.getElementById('t2').textContent='有效';document.getElementById('t2').className='ok'">點我</button>
    <b id="t2">尚未點擊</b></li>
  <li>③ 能否連外部網站：<b id="t3">未執行</b></li>
  <li>④ 安全政策（CSP）阻擋記錄：<b id="t4">無</b></li>
</ul>
<pre id="log"></pre>

<script>
(function(){
  function $(id){ return document.getElementById(id); }
  function log(s){ $("log").textContent += s + "\n"; }

  $("t1").textContent = "有執行";
  $("t1").className = "ok";

  document.addEventListener("securitypolicyviolation", function(e){
    $("t4").textContent = "有被擋";
    log("[CSP] 被擋：" + e.violatedDirective + " → " + e.blockedURI);
  });

  window.addEventListener("error", function(e){ log("[錯誤] " + e.message); });

  $("t3").textContent = "測試中…";
  var tests = [
    {name: "Yahoo 直連", url: "https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=5d&interval=1d"},
    {name: "代理 corsproxy", url: "https://corsproxy.io/?url=" + encodeURIComponent("https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=5d&interval=1d")},
    {name: "代理 allorigins", url: "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=5d&interval=1d")}
  ];
  var okCount = 0, done = 0;
  tests.forEach(function(t){
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, 10000);
    fetch(t.url, {signal: ctrl.signal}).then(function(r){
      clearTimeout(timer);
      return r.text().then(function(txt){
        if (r.ok && txt.indexOf("chart") >= 0){ okCount++; log("✔ " + t.name + "：成功"); }
        else log("✘ " + t.name + "：HTTP " + r.status + " " + txt.slice(0, 50).replace(/\s+/g, " "));
      });
    }).catch(function(e){
      clearTimeout(timer);
      log("✘ " + t.name + "：" + (e.name === "AbortError" ? "逾時" : e.message));
    }).then(function(){
      done++;
      if (done === tests.length){
        $("t3").textContent = okCount > 0 ? ("至少 " + okCount + " 種方式可用") : "全部失敗";
        $("t3").className = okCount > 0 ? "ok" : "";
      }
    });
  });
})();
</script>
</body>
</html>
