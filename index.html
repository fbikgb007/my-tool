<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>股票資料與運算工具</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --text:#1d2330; --sub:#667085; --line:#e3e6ec;
    --accent:#2563eb; --up:#d92d20; --down:#12a150; --warn:#b54708; --warnbg:#fffaeb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12141a; --card:#1b1e27; --text:#e8eaf0; --sub:#9aa3b5; --line:#2c3140;
      --accent:#5b8cff; --up:#ff6b5e; --down:#3ddc84; --warn:#fdb022; --warnbg:#2a2113;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    font-size:15px;line-height:1.5}
  .wrap{max-width:1000px;margin:0 auto;padding:14px}
  h1{font-size:20px;margin:6px 0 12px}
  h2{font-size:16px;margin:0 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  input,select,button,textarea{font:inherit;color:var(--text);background:var(--card);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  input[type=text]{min-width:130px}
  button{cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .stat{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .stat .k{font-size:12px;color:var(--sub)}
  .stat .v{font-size:17px;font-weight:600}
  .up{color:var(--up)} .down{color:var(--down)}
  .price{font-size:30px;font-weight:700}
  .muted{color:var(--sub);font-size:13px}
  #status{margin:8px 0 0;padding:8px 10px;border-radius:8px;font-size:14px;display:none}
  #status.info{display:block;background:var(--bg);border:1px solid var(--line)}
  #status.err{display:block;background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
  #status.ok{display:block;background:var(--bg);color:var(--down);border:1px solid var(--down)}
  canvas{width:100%;height:260px;display:block}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:6px;flex-wrap:wrap}
  .legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px;border-radius:2px}
  .tablebox{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:8px}
  table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
  th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{position:sticky;top:0;background:var(--card);color:var(--sub);font-weight:600}
  th:first-child,td:first-child{text-align:left}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>股票資料與運算工具</h1>

  <div class="card">
    <div class="row">
      <input type="text" id="symbol" placeholder="代號：2330 或 AAPL" value="2330" autocomplete="off">
      <select id="range">
        <option value="1mo">近 1 個月</option>
        <option value="3mo">近 3 個月</option>
        <option value="6mo">近 6 個月</option>
        <option value="1y" selected>近 1 年</option>
        <option value="2y">近 2 年</option>
        <option value="5y">近 5 年</option>
        <option value="10y">近 10 年</option>
        <option value="max">全部</option>
      </select>
      <button class="primary" id="btnFetch">抓取資料</button>
      <button id="btnRefresh" disabled>更新最新</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="btnImport">匯入 CSV</button>
      <button id="btnExport" disabled>匯出 CSV</button>
      <input type="file" id="file" accept=".csv,text/csv" class="hidden">
      <span class="muted">抓取失敗時可手動匯入 CSV（欄位：日期、開、高、低、收、量）</span>
    </div>
    <div id="status"></div>
  </div>

  <div class="card hidden" id="cardLatest">
    <div class="muted" id="name">—</div>
    <div class="row" style="align-items:baseline">
      <span class="price" id="lastPrice">—</span>
      <span id="lastChg" style="font-weight:600"></span>
    </div>
    <div class="muted" id="lastInfo"></div>
  </div>

  <div class="card hidden" id="cardChart">
    <h2>走勢圖</h2>
    <canvas id="chart"></canvas>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>收盤價</span>
      <span><i style="background:#f59e0b"></i>MA20</span>
      <span><i style="background:#a855f7"></i>MA60</span>
    </div>
  </div>

  <div class="card hidden" id="cardStats">
    <h2>基本運算</h2>
    <div class="grid" id="stats"></div>
  </div>

  <div class="card hidden" id="cardCustom">
    <h2>自訂運算</h2>
    <div class="muted">這個區塊預留給你之後補充的需求（例如買進點、部位試算、停損停利等）。</div>
    <div id="customOut"></div>
  </div>

  <div class="card hidden" id="cardTable">
    <h2>歷史資料</h2>
    <div class="tablebox">
      <table>
        <thead><tr>
          <th>日期</th><th>開</th><th>高</th><th>低</th><th>收</th><th>漲跌%</th><th>MA20</th><th>RSI14</th><th>量</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="muted" id="rowCount" style="margin-top:6px"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ===== 狀態 =====
  var state = { rows: [], symbol: "", meta: null, source: "" };

  // ===== 小工具 =====
  function $(id){ return document.getElementById(id); }
  function setStatus(type, msg){
    var el = $("status");
    el.className = msg ? type : "";
    el.textContent = msg || "";
  }
  function fmt(n, d){
    if (n === null || n === undefined || isNaN(n)) return "—";
    return Number(n).toLocaleString("en-US", {minimumFractionDigits: d === undefined ? 2 : d, maximumFractionDigits: d === undefined ? 2 : d});
  }
  function pct(n){ return (n === null || isNaN(n)) ? "—" : (n >= 0 ? "+" : "") + (n * 100).toFixed(2) + "%"; }
  function cls(n){ return n > 0 ? "up" : (n < 0 ? "down" : ""); }
  function setBusy(b){
    $("btnFetch").disabled = b;
    $("btnRefresh").disabled = b || !state.symbol;
  }

  // ===== 網路：直連 → 代理 =====
  function fetchWithTimeout(url, ms){
    var ctrl = new AbortController();
    var t = setTimeout(function(){ ctrl.abort(); }, ms || 12000);
    return fetch(url, {signal: ctrl.signal}).then(function(r){
      clearTimeout(t);
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).catch(function(e){ clearTimeout(t); throw e; });
  }
  function fetchViaChain(url){
    var chain = [
      {name: "直連", build: function(u){ return u; }},
      {name: "代理 A", build: function(u){ return "https://corsproxy.io/?url=" + encodeURIComponent(u); }},
      {name: "代理 B", build: function(u){ return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); }}
    ];
    var i = 0;
    function next(){
      if (i >= chain.length) return Promise.reject(new Error("所有連線方式都失敗"));
      var c = chain[i++];
      return fetchWithTimeout(c.build(url)).then(function(j){
        state.source = c.name;
        return j;
      }).catch(function(){ return next(); });
    }
    return next();
  }

  // ===== Yahoo 資料解析 =====
  function yahooUrl(sym, range){
    return "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(sym) +
           "?range=" + range + "&interval=1d&includeAdjustedClose=true";
  }
  function parseYahoo(json){
    var r = json && json.chart && json.chart.result && json.chart.result[0];
    if (!r || !r.timestamp) throw new Error("查無資料");
    var q = r.indicators.quote[0];
    var off = (r.meta && r.meta.gmtoffset) || 0;
    var rows = [];
    for (var i = 0; i < r.timestamp.length; i++){
      if (q.close[i] === null || q.close[i] === undefined) continue;
      rows.push({
        date: new Date((r.timestamp[i] + off) * 1000).toISOString().slice(0, 10),
        open: q.open[i], high: q.high[i], low: q.low[i], close: q.close[i], volume: q.volume[i] || 0
      });
    }
    return {rows: rows, meta: r.meta || {}};
  }
  function candidates(input){
    var s = input.trim().toUpperCase();
    if (/^\d{4,6}[A-Z]?$/.test(s)) return [s + ".TW", s + ".TWO"];
    return [s];
  }

  function loadSymbol(input, range){
    var list = candidates(input);
    var idx = 0;
    function tryNext(){
      if (idx >= list.length) return Promise.reject(new Error("找不到此代號的資料，請確認代號是否正確"));
      var sym = list[idx++];
      return fetchViaChain(yahooUrl(sym, range)).then(function(j){
        var p = parseYahoo(j);
        if (!p.rows.length) throw new Error("empty");
        state.symbol = sym; state.rows = p.rows; state.meta = p.meta;
      }).catch(function(e){
        if (idx < list.length) return tryNext();
        throw (e.message === "empty" ? new Error("找不到此代號的資料") : e);
      });
    }
    return tryNext();
  }

  // ===== 指標計算 =====
  function sma(arr, n){
    var out = [], sum = 0;
    for (var i = 0; i < arr.length; i++){
      sum += arr[i];
      if (i >= n) sum -= arr[i - n];
      out.push(i >= n - 1 ? sum / n : null);
    }
    return out;
  }
  function rsi(arr, n){
    var out = new Array(arr.length).fill(null);
    if (arr.length <= n) return out;
    var g = 0, l = 0, i;
    for (i = 1; i <= n; i++){
      var d = arr[i] - arr[i - 1];
      if (d >= 0) g += d; else l -= d;
    }
    g /= n; l /= n;
    out[n] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    for (i = n + 1; i < arr.length; i++){
      var dd = arr[i] - arr[i - 1];
      g = (g * (n - 1) + (dd > 0 ? dd : 0)) / n;
      l = (l * (n - 1) + (dd < 0 ? -dd : 0)) / n;
      out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    }
    return out;
  }
  function compute(rows){
    var close = rows.map(function(r){ return r.close; });
    var n = close.length;
    var res = {
      ma5: sma(close, 5), ma20: sma(close, 20), ma60: sma(close, 60), rsi14: rsi(close, 14),
      periodReturn: null, vol: null, mdd: null, hi: null, lo: null, avgVol20: null
    };
    if (n > 1){
      res.periodReturn = close[n - 1] / close[0] - 1;
      var rets = [];
      for (var i = 1; i < n; i++) rets.push(Math.log(close[i] / close[i - 1]));
      var m = rets.reduce(function(a, b){ return a + b; }, 0) / rets.length;
      var v = rets.reduce(function(a, b){ return a + (b - m) * (b - m); }, 0) / Math.max(1, rets.length - 1);
      res.vol = Math.sqrt(v) * Math.sqrt(252);
      var peak = close[0], mdd = 0;
      for (var j = 0; j < n; j++){
        if (close[j] > peak) peak = close[j];
        var dd = close[j] / peak - 1;
        if (dd < mdd) mdd = dd;
      }
      res.mdd = mdd;
    }
    var last = rows.slice(-252);
    res.hi = Math.max.apply(null, last.map(function(r){ return r.high; }));
    res.lo = Math.min.apply(null, last.map(function(r){ return r.low; }));
    var lv = rows.slice(-20);
    res.avgVol20 = lv.reduce(function(a, r){ return a + r.volume; }, 0) / lv.length;
    return res;
  }

  // ===== 繪圖 =====
  function drawChart(calc){
    var cv = $("chart");
    var dpr = window.devicePixelRatio || 1;
    var w = cv.clientWidth, h = 260;
    cv.width = w * dpr; cv.height = h * dpr;
    var ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var rows = state.rows, n = rows.length;
    if (n < 2) return;
    var padL = 52, padR = 8, padT = 10, padB = 22;
    var close = rows.map(function(r){ return r.close; });
    var all = close.concat(calc.ma20.filter(Boolean), calc.ma60.filter(Boolean));
    var mn = Math.min.apply(null, all), mx = Math.max.apply(null, all);
    var span = (mx - mn) || 1; mn -= span * 0.05; mx += span * 0.05;
    function X(i){ return padL + (w - padL - padR) * i / (n - 1); }
    function Y(v){ return padT + (h - padT - padB) * (1 - (v - mn) / (mx - mn)); }
    var cs = getComputedStyle(document.documentElement);
    var colLine = cs.getPropertyValue("--line").trim(), colSub = cs.getPropertyValue("--sub").trim(), colAcc = cs.getPropertyValue("--accent").trim();
    ctx.font = "11px sans-serif"; ctx.fillStyle = colSub; ctx.strokeStyle = colLine; ctx.lineWidth = 1;
    for (var g = 0; g <= 4; g++){
      var v = mn + (mx - mn) * g / 4, y = Y(v);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
      ctx.textAlign = "right"; ctx.fillText(v.toFixed(v >= 100 ? 0 : 2), padL - 6, y + 4);
    }
    ctx.textAlign = "left"; ctx.fillText(rows[0].date, padL, h - 6);
    ctx.textAlign = "right"; ctx.fillText(rows[n - 1].date, w - padR, h - 6);
    function line(arr, color, width){
      ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = width;
      var started = false;
      for (var i = 0; i < n; i++){
        if (arr[i] === null || arr[i] === undefined) continue;
        if (!started){ ctx.moveTo(X(i), Y(arr[i])); started = true; } else ctx.lineTo(X(i), Y(arr[i]));
      }
      ctx.stroke();
    }
    line(calc.ma60, "#a855f7", 1.3);
    line(calc.ma20, "#f59e0b", 1.3);
    line(close, colAcc, 1.8);
  }

  // ===== 畫面 =====
  function render(){
    var rows = state.rows, n = rows.length;
    if (!n) return;
    var calc = compute(rows);
    var last = rows[n - 1], prev = n > 1 ? rows[n - 2] : null;
    var chg = prev ? last.close / prev.close - 1 : null;
    var m = state.meta || {};

    ["cardLatest","cardChart","cardStats","cardCustom","cardTable"].forEach(function(id){ $(id).classList.remove("hidden"); });

    $("name").textContent = (m.longName || m.shortName || state.symbol) + "（" + state.symbol + "）";
    $("lastPrice").textContent = fmt(last.close);
    $("lastPrice").className = "price " + cls(chg);
    $("lastChg").textContent = chg === null ? "" : (fmt(last.close - prev.close) + "（" + pct(chg) + "）");
    $("lastChg").className = cls(chg);
    $("lastInfo").textContent = "資料日期 " + last.date + "　幣別 " + (m.currency || "—") + "　來源 " + (state.source || "匯入") + "　共 " + n + " 筆";

    var items = [
      ["區間報酬", pct(calc.periodReturn), cls(calc.periodReturn)],
      ["年化波動度", calc.vol === null ? "—" : (calc.vol * 100).toFixed(2) + "%", ""],
      ["最大回撤", pct(calc.mdd), "down"],
      ["近一年最高", fmt(calc.hi), ""],
      ["近一年最低", fmt(calc.lo), ""],
      ["MA5", fmt(calc.ma5[n - 1]), ""],
      ["MA20", fmt(calc.ma20[n - 1]), ""],
      ["MA60", fmt(calc.ma60[n - 1]), ""],
      ["RSI14", fmt(calc.rsi14[n - 1], 1), ""],
      ["近20日均量", fmt(calc.avgVol20, 0), ""],
      ["距近一年高點", pct(last.close / calc.hi - 1), cls(last.close / calc.hi - 1)],
      ["距 MA20", calc.ma20[n - 1] ? pct(last.close / calc.ma20[n - 1] - 1) : "—", ""]
    ];
    $("stats").innerHTML = items.map(function(it){
      return '<div class="stat"><div class="k">' + it[0] + '</div><div class="v ' + it[2] + '">' + it[1] + '</div></div>';
    }).join("");

    var html = [];
    for (var i = n - 1; i >= 0; i--){
      var r = rows[i], c = i > 0 ? r.close / rows[i - 1].close - 1 : null;
      html.push("<tr><td>" + r.date + "</td><td>" + fmt(r.open) + "</td><td>" + fmt(r.high) + "</td><td>" + fmt(r.low) +
        "</td><td>" + fmt(r.close) + '</td><td class="' + cls(c) + '">' + (c === null ? "—" : pct(c)) +
        "</td><td>" + fmt(calc.ma20[i]) + "</td>
